<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Poster Skills by CanFlyhang</title>
  <desc id="desc">A premium dark banner for a TRAE workflow skill that turns PPT templates into polished HTML slide decks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="0.58" stop-color="#121216"/>
      <stop offset="1" stop-color="#19191f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c7000b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c7000b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a80009"/>
      <stop offset="1" stop-color="#e02032"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1410" cy="60" r="480" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="520" fill="url(#red)"/>
  <path d="M80 482H1520" stroke="#ffffff" stroke-opacity="0.09"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="80" y="70" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.4">CanFlyhang</text>
    <text x="225" y="70" fill="#777780" font-size="14" font-weight="600" letter-spacing="2.5">/ OPEN SOURCE SKILL</text>

    <rect x="80" y="112" width="232" height="36" rx="18" fill="#c7000b"/>
    <text x="196" y="136" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1.8" text-anchor="middle">TRAE WORKFLOW SKILL</text>

    <text x="74" y="258" fill="#ffffff" font-size="116" font-weight="800" letter-spacing="-5">POSTER</text>
    <text x="74" y="368" fill="#ffffff" font-size="116" font-weight="800" letter-spacing="-5">SKILLS<tspan fill="#d61222">.</tspan></text>
    <text x="82" y="420" fill="#b8b8c0" font-size="22" font-weight="400">From PPT template to polished HTML slides.</text>
    <text x="82" y="458" fill="#6f6f78" font-size="13" font-weight="600" letter-spacing="2.4">MASTER · LAYOUT · VISUAL QA · 8K EXPORT</text>
  </g>

  <g transform="translate(1000 84)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="58" y="48" width="474" height="267" rx="18" fill="#15151a" stroke="#ffffff" stroke-opacity="0.09" transform="rotate(7 295 181)"/>
    <rect x="24" y="24" width="494" height="278" rx="18" fill="#1a1a20" stroke="#ffffff" stroke-opacity="0.12" transform="rotate(3 271 163)"/>
    <g filter="url(#shadow)">
      <rect width="500" height="281.25" rx="18" fill="#f7f7f8"/>
      <rect width="500" height="54" rx="18" fill="#ffffff"/>
      <rect y="36" width="500" height="18" fill="#ffffff"/>
      <rect x="24" y="17" width="62" height="18" rx="3" fill="#19191e"/>
      <text x="30" y="30" fill="#ffffff" font-size="8" font-weight="700">CF / LOGO</text>
      <text x="128" y="31" fill="#b10a16" font-size="16" font-weight="700">Design with constraints.</text>
      <circle cx="462" cy="27" r="13" fill="none" stroke="#c7000b" stroke-width="3"/>
      <rect y="53" width="500" height="3" fill="#c7000b"/>

      <rect x="28" y="82" width="212" height="126" rx="10" fill="#ececf0"/>
      <rect x="44" y="100" width="84" height="9" rx="4.5" fill="#c7000b"/>
      <rect x="44" y="124" width="152" height="12" rx="6" fill="#2d2d33"/>
      <rect x="44" y="146" width="132" height="7" rx="3.5" fill="#a4a4ac"/>
      <rect x="44" y="160" width="144" height="7" rx="3.5" fill="#b8b8bf"/>
      <rect x="44" y="181" width="72" height="14" rx="7" fill="#d8d8de"/>

      <rect x="258" y="82" width="214" height="58" rx="10" fill="#19191e"/>
      <text x="278" y="107" fill="#8d8d96" font-size="9" font-weight="600" letter-spacing="1.2">RESOLUTION</text>
      <text x="278" y="129" fill="#ffffff" font-size="18" font-weight="700">7680 × 4320</text>
      <rect x="258" y="150" width="102" height="58" rx="10" fill="#c7000b"/>
      <text x="309" y="185" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">16:9</text>
      <rect x="370" y="150" width="102" height="58" rx="10" fill="#e4e4e8"/>
      <text x="421" y="184" fill="#25252b" font-size="15" font-weight="700" text-anchor="middle">cqw / cqh</text>

      <rect x="28" y="228" width="444" height="1" fill="#d9d9de"/>
      <text x="28" y="254" fill="#7f7f88" font-size="10" font-weight="600" letter-spacing="1.5">ONE MASTER. EVERY PAGE INTENTIONAL.</text>
      <circle cx="458" cy="249" r="7" fill="#c7000b"/>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="80" y="505" fill="#55555e" font-size="11" letter-spacing="1.4">BUILT FOR TRAE · DESIGNED FOR REPRODUCIBLE PRESENTATIONS</text>
    <text x="1520" y="505" fill="#66666f" font-size="11" text-anchor="end" letter-spacing="1.4">CANFLYHANG / 2026</text>
  </g>
</svg>
